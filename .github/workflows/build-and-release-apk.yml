name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important for creating a release
    env:
      changed_files: ""
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ShootMatch.Mobile/package-lock.json'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ShootMatch.Mobile
        run: npm ci

      - name: Expo Prebuild
        working-directory: ShootMatch.Mobile
        run: npx expo prebuild --platform android

      - name: Build APK (Release)
        working-directory: ShootMatch.Mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: mv ShootMatch.Mobile/android/app/build/outputs/apk/release/app-release.apk ShootMatch.Mobile/android/app/build/outputs/apk/release/Pickic.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pickic-apk
          path: ShootMatch.Mobile/android/app/build/outputs/apk/release/Pickic.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Release Build #${{ github.run_number }}"
          body: "Automated APK build triggered by commit ${{ github.sha }}"
          files: ShootMatch.Mobile/android/app/build/outputs/apk/release/Pickic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lấy danh sách file thay đổi
        if: always()
        run: |
          CHANGED=$(git show --name-only --format= | awk 'NF' | head -n 15 | paste -sd ", " -)
          if [ -z "$CHANGED" ]; then
            CHANGED="Không có thông tin file"
          fi
          echo "changed_files=$CHANGED" >> $GITHUB_ENV

      - name: 📢 Báo cáo trạng thái CI/CD về Discord
        uses: sarisia/actions-status-discord@v1
        if: always() # Kim bài miễn tử: Các bước trên có lỗi thì bước này vẫn phải chạy để báo cáo
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Trạng thái CI/CD: ${{ github.repository }}"
          description: |
            **Người chạy:** `${{ github.actor }}`
            **Nhánh:** `${{ github.ref_name }}`
            **Nội dung Commit:** `${{ github.event.head_commit.message || 'Không có' }}`
            
            **Các file đã thay đổi:**
            ```text
            ${{ env.changed_files }}
            ```
            
            👉 Bấm vào tiêu đề màu xanh bên trên để xem log chi tiết.
