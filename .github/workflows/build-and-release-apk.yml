name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important for creating a release
    env:
      changed_files: ""
      build_duration: ""
      build_result_msg: ""
      short_sha: ""
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ghi nhận thời gian bắt đầu & Lấy file thay đổi
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          
          # Lấy danh sách file thay đổi (loại bỏ file hệ thống .cursor, .config, v.v.)
          CHANGED=$(git show --name-only --format= | grep -v -E '^(\.cursor/|\.config/|\.git)' | awk 'NF' | head -n 15 | sed 's/^/- /')
          if [ -z "$CHANGED" ]; then
            CHANGED="- Không có file mã nguồn nào thay đổi hoặc chỉ đổi file hệ thống"
          fi
          
          echo "changed_files<<EOF" >> $GITHUB_ENV
          echo "$CHANGED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 📢 Báo cáo nhận commit mới về Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: "Success" # Mượn status này để gửi tin nhắn
          color: "0xF1C40F" # Ghi đè màu vàng (Gold)
          noprefix: true
          nocontext: true
          title: "🔨 Bắt đầu build APK: ${{ github.repository }} (Build #${{ github.run_number }})"
          description: |
            **Người commit:** `${{ github.actor }}`
            **Nhánh:** `${{ github.ref_name }}`
            **Commit:** [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Nội dung Commit:** `${{ github.event.head_commit.message || 'Không có' }}`
            
            **Các file thay đổi:**
            ${{ env.changed_files }}
            
            👉 Bấm vào tiêu đề màu xanh bên trên để xem log chi tiết.
            **Repository:** ${{ github.repository }}
            **Ref:** ${{ github.ref }}
            **Event - ${{ github.event_name }}:** `${{ env.SHORT_SHA }} ${{ github.event.head_commit.message || 'Không có' }}`
            **Triggered by:** ${{ github.actor }}
            **Workflow:** ${{ github.workflow }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ShootMatch.Mobile/package-lock.json'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ShootMatch.Mobile
        run: npm ci

      - name: Expo Prebuild
        working-directory: ShootMatch.Mobile
        run: npx expo prebuild --platform android

      - name: Build APK (Release)
        working-directory: ShootMatch.Mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: mv ShootMatch.Mobile/android/app/build/outputs/apk/release/app-release.apk ShootMatch.Mobile/android/app/build/outputs/apk/release/Pickic.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pickic-apk
          path: ShootMatch.Mobile/android/app/build/outputs/apk/release/Pickic.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Release Build #${{ github.run_number }}"
          body: "Automated APK build triggered by commit ${{ github.sha }}"
          files: ShootMatch.Mobile/android/app/build/outputs/apk/release/Pickic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính thời gian chạy và chuẩn bị thông báo
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))
          echo "build_duration=${MIN}m ${SEC}s" >> $GITHUB_ENV
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "build_result_msg=🚀 Bản build APK đã sẵn sàng để tải xuống từ GitHub Release!" >> $GITHUB_ENV
          else
            echo "build_result_msg=❌ Quá trình build gặp lỗi, vui lòng kiểm tra log." >> $GITHUB_ENV
          fi

      - name: 📢 Báo cáo kết quả CI/CD về Discord
        uses: sarisia/actions-status-discord@v1
        if: always() # Kim bài miễn tử: Các bước trên có lỗi thì bước này vẫn phải chạy để báo cáo
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          nocontext: true # Tắt context mặc định để hiển thị gọn gàng hơn
          title: "Trạng thái CI/CD: ${{ github.repository }}"
          description: |
            **Kết quả:** `${{ job.status }}`
            **Thời gian chạy:** `${{ env.build_duration }}`
            
            ${{ env.build_result_msg }}
            
            👉 Bấm vào tiêu đề màu xanh bên trên để xem log chi tiết.
