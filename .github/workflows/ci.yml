name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend dependencies
        run: dotnet restore ShootMatch.sln

      - name: Build backend solution
        run: dotnet build ShootMatch.sln --no-restore -c Release

  web-build:
    name: Build web frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ShootMatch.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ShootMatch.Web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web frontend
        run: npm run build

  mobile-typecheck:
    name: Type-check mobile app
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ShootMatch.Mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ShootMatch.Mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Type-check mobile app
        run: npx tsc -p tsconfig.json --noEmit
